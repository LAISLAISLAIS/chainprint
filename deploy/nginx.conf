server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options DENY always;

    # Proxy Odesli so Spotify identity works without browser CORS issues
    location = /api/odesli {
        proxy_pass https://api.song.link/v1-alpha.1/links$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host api.song.link;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
    }

    # /analyze/ → analyze/index.html, etc.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?|json)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
