<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CHAINPRINT</title>
  <meta name="description" content="Reverse-engineer any vocal mix and recreate the chain in your DAW." />
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/chassis.css" />
  <link rel="stylesheet" href="css/logo.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <style>
    body.landing-body {
      background: #000;
    }

    body.landing-body::before {
      opacity: 0.22;
      mix-blend-mode: soft-light;
    }

    .landing {
      --brand: #f4f4f4;
      --silkscreen: #8a8a8a;
      --accent: #f4f4f4;
      --accent-soft: rgba(255, 255, 255, 0.08);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 20px 24px 28px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse 70% 45% at 50% 38%, rgba(255, 255, 255, 0.045) 0%, transparent 60%),
        #000;
    }

    .hero-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.85;
      mask-image: radial-gradient(ellipse 65% 50% at 50% 45%, #000 15%, transparent 72%);
      -webkit-mask-image: radial-gradient(ellipse 65% 50% at 50% 45%, #000 15%, transparent 72%);
    }

    .landing-nav,
    .hero {
      position: relative;
      z-index: 2;
    }

    .landing-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(1120px, 100%);
      margin: 0 auto;
    }

    .landing-nav .logo-word {
      opacity: 0.45;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: -0.03em;
    }

    .landing-nav .logo-mark {
      opacity: 0.55;
    }

    .landing .nav-quota {
      color: #cfcfcf;
      background: rgba(255, 255, 255, 0.06);
    }

    .landing .account-menu-trigger {
      background: rgba(255, 255, 255, 0.05);
    }

    .landing .nav-links a {
      color: #9a9a9a;
    }

    .landing .nav-links a:hover {
      color: #f4f4f4;
    }

    .landing .nav-cta {
      background: #f4f4f4 !important;
      color: #0a0a0a !important;
    }

    .landing .nav-cta:hover {
      background: #fff !important;
    }

    .hero {
      flex: 1;
      display: grid;
      place-items: center;
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 6vh 0 10vh;
    }

    .hero-copy {
      text-align: center;
      width: min(36rem, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-hero {
      margin-bottom: 28px;
    }

    .hero-brand {
      font-family: var(--font-brand);
      font-weight: 800;
      font-size: clamp(2.85rem, 10vw, 5rem);
      letter-spacing: -0.06em;
      line-height: 0.9;
      color: #f7f7f7;
      margin: 0 0 18px;
      animation: hero-in 1.2s var(--ease-out) 0.06s both;
    }

    .hero-line {
      margin: 0 0 40px;
      max-width: 18rem;
      font-size: clamp(0.98rem, 2.2vw, 1.12rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.5;
      color: #8f8f8f;
      animation: hero-in 1.2s var(--ease-out) 0.16s both;
    }

    .cta-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: hero-in 1.2s var(--ease-out) 0.26s both;
    }

    .landing .btn-primary {
      min-width: 11.5rem;
      padding: 13px 28px;
      border-radius: 999px;
      background: #f4f4f4;
      color: #0a0a0a;
      font-weight: 600;
    }

    .landing .btn-primary:hover {
      background: #fff;
    }

    .cta-login {
      font-size: 0.88rem;
      color: #7a7a7a;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .cta-login:hover {
      color: #f4f4f4;
    }

    @keyframes hero-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-brand,
      .hero-line,
      .cta-row,
      .logo-hero {
        animation: none;
      }
    }

    @media (max-width: 560px) {
      .landing { padding: 16px 18px 24px; }
      .hero { padding: 8vh 0 12vh; }
      .logo-hero { --mark-w: 132px; margin-bottom: 22px; }
      .hero-line { margin-bottom: 32px; }
    }
  </style>
</head>
<body class="landing-body">
  <div class="landing">
    <canvas class="hero-canvas" data-hero-canvas aria-hidden="true"></canvas>

    <header class="landing-nav">
      <a class="logo" href="./" aria-label="Chainprint home">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="logo-word">Chainprint</span>
      </a>
      <nav class="nav-links" aria-label="Primary">
        <span class="nav-auth" data-auth-nav></span>
      </nav>
    </header>

    <main class="hero">
      <div class="hero-copy">
        <div class="logo-hero" data-chain-mark aria-hidden="true"></div>
        <h1 class="hero-brand">Chainprint</h1>
        <p class="hero-line">Recreate any vocal mix in your DAW.</p>
        <div class="cta-row" data-home-cta>
          <a class="btn btn-primary" href="auth/?mode=signup&next=/analyze/">Sign up free</a>
          <a class="cta-login" href="auth/?mode=login&next=/analyze/">Log in</a>
        </div>
      </div>
    </main>
  </div>
  <script type="module">
    import { mountHeroMotion } from "./js/ui/hero-motion.js";
    import { mountChainMark } from "./js/ui/chain-mark.js";
    import { getSession } from "./js/auth/session.js";
    import { mountAuthNav } from "./js/ui/nav-auth.js";
    import { canAnalyze } from "./js/auth/quota.js";

    mountHeroMotion(document.querySelector("[data-hero-canvas]"));
    mountChainMark(document.querySelector("[data-chain-mark]"));
    mountAuthNav(document.querySelector("[data-auth-nav]"), {
      authHref: "auth/",
      next: "/analyze/",
    });

    const account = getSession();
    const cta = document.querySelector("[data-home-cta]");
    if (account && cta) {
      const access = canAnalyze(account);
      cta.innerHTML = access.ok
        ? `<a class="btn btn-primary" href="analyze/">Analyze a track</a>
           <a class="cta-login" href="analyze/">Open workspace</a>`
        : `<a class="btn btn-primary" href="analyze/">View account</a>
           <a class="cta-login" href="auth/?mode=login">Switch account</a>`;
    }
  </script>
</body>
</html>
