<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <meta name="description" content="Chainprint reverse-engineers any mix — vocal, instrumental, or full song — so you can recreate the chain in Logic, Ableton, or Pro Tools." />

  <link rel="icon" href="assets/favicon-48.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="site.webmanifest" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Chainprint" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:title" content="Chainprint — Recreate Any Mix in Your DAW" />
  <meta property="og:description" content="Reverse-engineer vocal, instrumental, or full-mix references into a DAW chain you can rebuild." />
  <meta property="og:url" content="https://chainprint.app/" />
  <meta property="og:image" content="https://chainprint.app/assets/og-image.png" />
  <meta property="og:image:secure_url" content="https://chainprint.app/assets/og-image.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Chainprint — Recreate Any Mix in Your DAW" />
  <meta name="twitter:description" content="Reverse-engineer vocal, instrumental, or full-mix references into a DAW chain you can rebuild." />
  <meta name="twitter:image" content="https://chainprint.app/assets/og-image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" />
  <link rel="stylesheet" href="css/chassis.css" />
  <link rel="stylesheet" href="css/logo.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <style>
    html {
      overflow-x: clip;
    }

    body.landing-body {
      background: #000;
      overflow-x: clip;
      max-width: 100%;
    }

    body.landing-body::before {
      opacity: 0.2;
      mix-blend-mode: soft-light;
    }

    .landing {
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      padding: 22px 28px 32px;
      position: relative;
      overflow-x: clip;
      overflow-y: auto;
      background:
        radial-gradient(ellipse 72% 48% at 50% 42%, rgba(255, 255, 255, 0.05) 0%, transparent 62%),
        radial-gradient(ellipse 40% 30% at 15% 85%, rgba(255, 255, 255, 0.025) 0%, transparent 55%),
        #000;
    }

    .hero-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.9;
      mask-image: radial-gradient(ellipse 62% 48% at 50% 44%, #000 12%, transparent 74%);
      -webkit-mask-image: radial-gradient(ellipse 62% 48% at 50% 44%, #000 12%, transparent 74%);
    }

    .landing-nav,
    .hero {
      position: relative;
      z-index: 2;
    }

    .landing-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: min(1120px, 100%);
      margin: 0 auto;
      min-width: 0;
    }

    .landing-nav .logo {
      min-width: 0;
      flex-shrink: 1;
    }

    .landing-nav .nav-links {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 2px;
      min-width: 0;
      flex: 0 1 auto;
    }

    .landing-nav .nav-auth {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      min-width: 0;
    }

    .landing-nav .logo-word {
      opacity: 0.92;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.04em;
    }

    .landing-nav .logo-mark {
      opacity: 0.9;
    }

    .landing .nav-quota {
      color: #cfcfcf;
      background: rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-btn);
    }

    .landing .account-menu-trigger {
      background: rgba(255, 255, 255, 0.05);
      border-radius: var(--radius-btn);
    }

    .landing .nav-links a {
      color: #9a9a9a;
      border-radius: var(--radius-btn);
    }

    .landing .nav-links a:hover {
      color: #f4f4f4;
    }

    .landing .nav-cta {
      background: #f4f4f4 !important;
      color: #0a0a0a !important;
      border-radius: var(--radius-btn) !important;
    }

    .landing .nav-cta:hover {
      background: #fff !important;
    }

    .hero {
      flex: 1;
      display: grid;
      place-items: center;
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 7vh 0 11vh;
    }

    .hero-copy {
      text-align: center;
      width: min(40rem, 100%);
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 2px;
      box-sizing: border-box;
    }

    .logo-hero {
      margin-bottom: 32px;
      animation: hero-in 1.15s var(--ease-out) both;
    }

    .hero-brand {
      font-family: var(--font-brand);
      font-weight: 800;
      font-size: clamp(2.4rem, 9vw, 5.25rem);
      letter-spacing: -0.055em;
      line-height: 0.95;
      color: #f8f8f8;
      margin: 0 0 20px;
      max-width: 100%;
      width: 100%;
      padding-inline: 0.06em;
      box-sizing: border-box;
      overflow: visible;
      text-align: center;
      animation: hero-in 1.2s var(--ease-out) 0.06s both;
    }

    .hero-line {
      margin: 0 0 42px;
      max-width: 22rem;
      width: 100%;
      white-space: normal;
      text-wrap: balance;
      font-size: clamp(0.9rem, 2.5vw, 1.15rem);
      font-weight: 400;
      letter-spacing: -0.018em;
      line-height: 1.45;
      color: #949494;
      animation: hero-in 1.2s var(--ease-out) 0.16s both;
    }

    .cta-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      animation: hero-in 1.2s var(--ease-out) 0.26s both;
    }

    .landing .btn-primary {
      min-width: 12rem;
      padding: 14px 30px;
      border-radius: var(--radius-btn);
      background: #f4f4f4;
      color: #0a0a0a;
      font-weight: 600;
      letter-spacing: -0.02em;
      transition: background 0.2s ease, transform 0.2s var(--ease-out);
    }

    .landing .btn-primary:hover {
      background: #fff;
      transform: translateY(-1px);
    }

    .cta-login {
      font-size: 0.9rem;
      color: #7a7a7a;
      text-decoration: none;
      font-weight: 500;
      letter-spacing: -0.01em;
      transition: color 0.2s ease;
    }

    .cta-login:hover {
      color: #f4f4f4;
    }

    .cta-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      justify-content: center;
      margin-top: 4px;
    }

    .cta-tool {
      font-size: 0.84rem;
      color: #6a6a6a;
      text-decoration: none;
      font-weight: 500;
      letter-spacing: -0.01em;
      transition: color 0.2s ease;
    }

    .cta-tool:hover {
      color: #cfcfcf;
    }

    .landing-legal {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom, 0));
      font-size: 0.78rem;
      color: #555;
      z-index: 2;
    }

    .landing-legal a {
      color: #6a6a6a;
      text-decoration: none;
    }

    .landing-legal a:hover {
      color: #cfcfcf;
    }

    @keyframes hero-in {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-brand,
      .hero-line,
      .cta-row,
      .logo-hero {
        animation: none;
      }

      .landing .btn-primary:hover {
        transform: none;
      }
    }

    @media (max-width: 640px) {
      .landing {
        padding:
          calc(12px + env(safe-area-inset-top, 0))
          max(16px, env(safe-area-inset-right, 0px))
          calc(20px + env(safe-area-inset-bottom, 0))
          max(16px, env(safe-area-inset-left, 0px));
      }

      .landing-nav {
        gap: 10px;
        width: 100%;
      }

      .landing-nav .logo {
        gap: 7px;
        flex: 0 1 auto;
      }

      .landing-nav .logo-mark {
        width: 22px;
        height: 11px;
      }

      .landing-nav .logo-word {
        font-size: 0.88rem;
      }

      .landing-nav .nav-links {
        gap: 0;
        max-width: min(100%, 18rem);
      }

      .landing .nav-links a,
      .landing .account-menu-trigger,
      .landing .nav-cta {
        font-size: 0.76rem !important;
        padding: 6px 10px !important;
        min-height: 36px;
      }

      .landing .nav-cta {
        padding: 6px 12px !important;
        flex-shrink: 0;
      }

      .hero {
        width: 100%;
        max-width: 100%;
        padding: 4vh 0 7vh;
        align-content: center;
        min-width: 0;
      }

      .hero-copy {
        width: 100%;
        max-width: 100%;
        padding: 0;
        min-width: 0;
      }

      .logo-hero {
        --mark-w: min(112px, 36vw);
        margin-bottom: 18px;
      }

      .hero-brand {
        /* Fit “Chainprint” on narrow phones without clipping glyphs */
        font-size: clamp(1.85rem, 11.2vw, 2.55rem);
        letter-spacing: -0.045em;
        line-height: 1.05;
        margin-bottom: 14px;
        padding-inline: 0.12em;
      }

      .hero-line {
        margin-bottom: 26px;
        max-width: 17.5rem;
        font-size: 0.92rem;
      }

      .landing .btn-primary {
        width: min(100%, 17rem);
        min-height: 48px;
        justify-content: center;
      }

      .cta-row {
        width: 100%;
        gap: 14px;
      }

      .cta-login {
        min-height: 40px;
        display: inline-flex;
        align-items: center;
      }
    }

    @media (max-width: 380px) {
      .landing {
        padding-left: max(14px, env(safe-area-inset-left, 0px));
        padding-right: max(14px, env(safe-area-inset-right, 0px));
      }

      .landing-nav .logo-word {
        max-width: 6.75rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .hero-brand {
        font-size: clamp(1.7rem, 10.5vw, 2.15rem);
      }
    }
  </style>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://chainprint.app/#website",
        "name": "Chainprint",
        "url": "https://chainprint.app/",
        "description": "Reverse-engineer any mix — vocal, instrumental, or full song — and recreate the chain in your DAW.",
        "publisher": { "@id": "https://chainprint.app/#org" }
      },
      {
        "@type": "Organization",
        "@id": "https://chainprint.app/#org",
        "name": "Chainprint",
        "url": "https://chainprint.app/",
        "logo": "https://chainprint.app/assets/icon-512.png",
        "description": "Mix reverse-engineering for producers — vocal, instrumental, and full-song chains."
      },
      {
        "@type": "SoftwareApplication",
        "name": "Chainprint",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "url": "https://chainprint.app/",
        "description": "Analyze a reference mix and rebuild vocal, instrumental, or full-mix settings in your DAW."
      }
    ]
  }
  </script>
</head>
<body class="landing-body">
  <div class="landing">
    <canvas class="hero-canvas" data-hero-canvas aria-hidden="true"></canvas>

    <header class="landing-nav">
      <a class="logo" href="./" aria-label="Chainprint home">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="logo-word">Chainprint</span>
      </a>
      <nav class="nav-links" aria-label="Primary">
        <a href="tools/">Tools</a>
        <a href="help/">Help</a>
        <span class="nav-auth" data-auth-nav></span>
      </nav>
    </header>

    <main class="hero">
      <div class="hero-copy">
        <div class="logo-hero" data-chain-mark aria-hidden="true"></div>
        <h1 class="hero-brand">Chainprint</h1>
        <p class="hero-line">Recreate any mix in your DAW — vocal, instrumental, or full song.</p>
        <div class="cta-row" data-home-cta>
          <a class="btn btn-primary" href="auth/?mode=signup&next=/analyze/">Sign up free</a>
          <a class="cta-login" href="auth/?mode=login&next=/analyze/">Log in</a>
        </div>
      </div>
    </main>

    <footer class="landing-legal">
      <a href="tools/">Tools</a>
      <span aria-hidden="true">·</span>
      <a href="help/">Help</a>
      <span aria-hidden="true">·</span>
      <a href="terms/">Terms</a>
      <span aria-hidden="true">·</span>
      <a href="privacy/">Privacy</a>
    </footer>
  </div>
  <script type="module">
    import { mountHeroMotion } from "./js/ui/hero-motion.js";
    import { mountChainMark } from "./js/ui/chain-mark.js";
    import { getSession, initAuth } from "./js/auth/session.js";
    import { mountAuthNav } from "./js/ui/nav-auth.js";
    import { canAnalyze } from "./js/auth/quota.js";

    mountHeroMotion(document.querySelector("[data-hero-canvas]"));
    mountChainMark(document.querySelector("[data-chain-mark]"));
    await initAuth();
    mountAuthNav(document.querySelector("[data-auth-nav]"), {
      authHref: "auth/",
      next: "/analyze/",
      settingsHref: "settings/",
    });

    const account = getSession();
    const cta = document.querySelector("[data-home-cta]");
    if (account && cta) {
      const access = canAnalyze(account);
      cta.innerHTML = access.ok
        ? `<a class="btn btn-primary" href="analyze/">Analyze a track</a>
           <a class="cta-login" href="analyze/">Open workspace</a>`
        : `<a class="btn btn-primary" href="analyze/">View account</a>
           <a class="cta-login" href="auth/?mode=login">Switch account</a>`;
    }
  </script>
</body>
</html>
