# Static site + serverless identity lookup
[build]
  publish = "."
  functions = "netlify/functions"

# Private beta site password (netlify/edge-functions/site-gate.js)
[[edge_functions]]
  function = "site-gate"
  path = "/*"

# Prefer _redirects for /api/odesli → function; keep directory trailing slashes here
[[redirects]]
  from = "/analyze"
  to = "/analyze/"
  status = 301

[[redirects]]
  from = "/auth"
  to = "/auth/"
  status = 301

[[redirects]]
  from = "/calibration"
  to = "/calibration/"
  status = 301

[[redirects]]
  from = "/find"
  to = "/find/"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/privacy/"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/terms/"
  status = 301

[[redirects]]
  from = "/settings"
  to = "/settings/"
  status = 301

[[redirects]]
  from = "/tools"
  to = "/tools/"
  status = 301

[[redirects]]
  from = "/help"
  to = "/help/"
  status = 301

[[redirects]]
  from = "/help/ableton-mcp"
  to = "/help/ableton-mcp/"
  status = 301

[[redirects]]
  from = "/c"
  to = "/c/"
  status = 301

[[redirects]]
  from = "/c/:id"
  to = "/.netlify/functions/share-page"
  status = 200
  force = true

[[redirects]]
  from = "/api/shares"
  to = "/.netlify/functions/shares"
  status = 200

[[redirects]]
  from = "/api/og/:id"
  to = "/.netlify/functions/og-chain"
  status = 200

[[redirects]]
  from = "/api/og"
  to = "/.netlify/functions/og-chain"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/og-*.png"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
