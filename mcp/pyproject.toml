[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chainprint-mcp"
version = "0.1.0"
description = "MCP server that applies Chainprint mix chains directly inside Ableton Live"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Chainprint" }]
keywords = ["ableton", "mcp", "mixing", "chainprint"]
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
chainprint-mcp = "chainprint_mcp.__main__:main"

[project.urls]
Homepage = "https://chainprint.app"
Documentation = "https://chainprint.app/help/ableton-mcp/"
Repository = "https://github.com/LAISLAISLAIS/chainprint"

[tool.hatch.build.targets.wheel]
packages = ["src/chainprint_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/remote_script",
  "/README.md",
  "/PUBLISH.md",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel.sources]
"src/chainprint_mcp" = "chainprint_mcp"
