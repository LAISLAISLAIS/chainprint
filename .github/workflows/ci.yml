name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci || npm install
      - name: Syntax-check Netlify functions
        run: |
          set -e
          for f in netlify/functions/*.mjs netlify/functions/_shared/*.mjs; do
            case "$f" in
              *.test.mjs) continue ;;
            esac
            node --check "$f"
          done
      - name: Release check
        run: npm run check
      - name: Billing unit tests
        run: npm run test:billing
      - name: Ableton rack tests
        run: npm run test:ableton

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest -q
